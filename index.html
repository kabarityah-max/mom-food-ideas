<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Levantine Dish</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', serif;
      background: #1a0f0a;
      color: #f5e6d0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header .date {
      font-family: 'Arial', sans-serif;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #c8956a;
      margin-bottom: 8px;
    }

    .header h1 {
      font-size: 28px;
      color: #e8c99a;
      font-weight: normal;
      letter-spacing: 1px;
    }

    .card {
      background: linear-gradient(145deg, #2a1a0e, #1f1308);
      border: 1px solid #5a3820;
      border-radius: 16px;
      max-width: 640px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }

    .card-banner {
      background: linear-gradient(135deg, #8b4513, #c17f3a, #8b4513);
      padding: 32px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card-banner::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }

    .emoji {
      font-size: 72px;
      display: block;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    }

    .dish-name {
      font-size: 32px;
      color: #fff8ee;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
      margin-bottom: 4px;
    }

    .dish-name-arabic {
      font-size: 22px;
      color: #ffe0b0;
      opacity: 0.85;
      font-style: italic;
    }

    .card-body {
      padding: 32px 40px;
    }

    .origin-badge {
      display: inline-block;
      background: rgba(139, 69, 19, 0.3);
      border: 1px solid #8b4513;
      color: #e8a060;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 20px;
      font-family: 'Arial', sans-serif;
    }

    .description {
      font-size: 17px;
      line-height: 1.75;
      color: #e0cdb8;
      margin-bottom: 28px;
    }

    .section-title {
      font-family: 'Arial', sans-serif;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #c8956a;
      margin-bottom: 12px;
    }

    .ingredients {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 28px;
    }

    .ingredient {
      background: rgba(200, 149, 106, 0.12);
      border: 1px solid rgba(200, 149, 106, 0.3);
      color: #d4aa80;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 14px;
    }

    .steps {
      list-style: none;
      margin-bottom: 28px;
    }

    .steps li {
      display: flex;
      gap: 16px;
      margin-bottom: 14px;
      font-size: 15px;
      line-height: 1.6;
      color: #d8c4a8;
    }

    .step-num {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      background: #8b4513;
      color: #fff8ee;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-family: 'Arial', sans-serif;
      font-weight: bold;
      margin-top: 1px;
    }

    .tip-box {
      background: rgba(200, 149, 106, 0.08);
      border-left: 3px solid #c8956a;
      padding: 14px 18px;
      border-radius: 0 8px 8px 0;
      font-size: 14px;
      color: #c8b090;
      line-height: 1.6;
    }

    .tip-box strong {
      color: #e8a060;
    }

    .footer {
      text-align: center;
      margin-top: 28px;
      font-family: 'Arial', sans-serif;
      font-size: 12px;
      color: #6b5040;
      letter-spacing: 1px;
    }

    .refresh-btn {
      display: block;
      margin: 20px auto 0;
      background: none;
      border: 1px solid #5a3820;
      color: #c8956a;
      padding: 8px 24px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .refresh-btn:hover {
      background: rgba(200, 149, 106, 0.1);
      border-color: #c8956a;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="date" id="date-display"></div>
  <h1>Your Daily Levantine Dish</h1>
</div>

<div class="card">
  <div class="card-banner">
    <span class="emoji" id="dish-emoji"></span>
    <div class="dish-name" id="dish-name"></div>
    <div class="dish-name-arabic" id="dish-arabic"></div>
  </div>
  <div class="card-body">
    <div class="origin-badge" id="dish-origin"></div>
    <p class="description" id="dish-description"></p>

    <div class="section-title">Key Ingredients</div>
    <div class="ingredients" id="dish-ingredients"></div>

    <div class="section-title">How to Make It</div>
    <ol class="steps" id="dish-steps"></ol>

    <div class="tip-box" id="dish-tip"></div>
  </div>
</div>

<div class="footer">A new dish every day &mdash; come back tomorrow</div>
<button class="refresh-btn" onclick="loadDish()">Try a different dish today</button>

<script src="dishes.js"></script>
<script>
  let todayOffset = 0;

  function getDailyDish() {
    const today = new Date();
    const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / 86400000);
    const index = (dayOfYear + todayOffset) % dishes.length;
    return dishes[index];
  }

  function formatDate() {
    return new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }

  function loadDish() {
    const dish = getDailyDish();
    todayOffset = (todayOffset + 1) % dishes.length;

    document.getElementById('date-display').textContent = formatDate();
    document.getElementById('dish-emoji').textContent = dish.emoji;
    document.getElementById('dish-name').textContent = dish.name;
    document.getElementById('dish-arabic').textContent = dish.arabic;
    document.getElementById('dish-origin').textContent = dish.origin;
    document.getElementById('dish-description').textContent = dish.description;

    const ingContainer = document.getElementById('dish-ingredients');
    ingContainer.innerHTML = dish.ingredients.map(i => `<span class="ingredient">${i}</span>`).join('');

    const stepsEl = document.getElementById('dish-steps');
    stepsEl.innerHTML = dish.steps.map((s, i) => `
      <li><span class="step-num">${i + 1}</span><span>${s}</span></li>
    `).join('');

    document.getElementById('dish-tip').innerHTML = dish.tip;
  }

  // Initial load — show today's dish
  todayOffset = 0;
  loadDish();
  // Reset offset so first click cycles to the next
  todayOffset = 1;
</script>
</body>
</html>
