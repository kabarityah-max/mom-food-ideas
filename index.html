  let todayOffset = 0;

  function getDailyDish() {
    const today = new Date();
    const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / 86400000);
    const index = (dayOfYear + todayOffset) % dishes.length;
    return dishes[index];
  }

  function formatDate() {
    return new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }

  function loadDish() {
    const dish = getDailyDish();
    todayOffset = (todayOffset + 1) % dishes.length;

    document.getElementById('date-display').textContent = formatDate();
    document.getElementById('dish-emoji').textContent = dish.emoji;
    document.getElementById('dish-name').textContent = dish.name;
    document.getElementById('dish-arabic').textContent = dish.arabic;
    document.getElementById('dish-origin').textContent = dish.origin;
    document.getElementById('dish-description').textContent = dish.description;

    const ingContainer = document.getElementById('dish-ingredients');
    ingContainer.innerHTML = dish.ingredients.map(i => `<span class="ingredient">${i}</span>`).join('');

    const stepsEl = document.getElementById('dish-steps');
    stepsEl.innerHTML = dish.steps.map((s, i) => `
      <li><span class="step-num">${i + 1}</span><span>${s}</span></li>
    `).join('');

    document.getElementById('dish-tip').innerHTML = dish.tip;
  }

  // Initial load — show today's dish
  todayOffset = 0;
  loadDish();
  // Reset offset so first click cycles to the next
  todayOffset = 1;
</script>
